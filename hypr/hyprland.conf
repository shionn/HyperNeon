# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

#windowrulev2 = opacity 0.7  0.7  0.7 , initialClass:^(.*wofi.*)$
windowrule {
	name = incrustation video float
	match:title = ^(Incrustation vidéo)$
	float = on
}
windowrule {
	name = noound on fullscreen
	match:fullscreen = on
	rounding = 0
}
windowrule {
	name = suppress maximise
	match:initial_class = .*
	suppress_event = maximize
}

windowrule {
	name = float gimp export
	match:title = Exporter l.image comme (JPEG)$
	float = on
	center = on
}

windowrule {
	name = float Godo Debug
	match:title =.* \(DEBUG\)$
	float = on
	center = on
}



